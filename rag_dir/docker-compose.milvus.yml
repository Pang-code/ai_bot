# Milvus Standalone (单机版) Docker Compose
# 用途: RAG 向量库, 存储切片 embedding (bge-m3, 1024 维)
# 与 MinerU 的 docker-compose.yml 相互独立, 可同时运行
#
# 启动:   docker compose -f docker-compose.milvus.yml up -d
# 状态:   docker compose -f docker-compose.milvus.yml ps
# 停止:   docker compose -f docker-compose.milvus.yml down          (保留数据)
# 清数据: docker compose -f docker-compose.milvus.yml down -v       (删除卷, 慎用)
#
# 端口说明 (避开 MinerU 的 8080):
#   19530  gRPC 接口, pymilvus 连接用
#   9091   健康检查 / metrics
#   3000   Attu 管理界面 (浏览器打开, 主机填 milvus-standalone)

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcdData:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio --console-address ":9001"
    volumes:
      - minioData:/minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus-standalone:
    image: milvusdb/milvus:v2.5.6
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvusData:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 60s

  # Milvus 管理界面 (可选, 不需要可整段删掉)
  attu:
    image: milvusdb/attu:latest
    container_name: milvus-attu
    environment:
      MILVUS_URL: milvus-standalone:19530
    ports:
      - "3000:3000"
    depends_on:
      milvus-standalone:
        condition: service_healthy

volumes:
  etcdData:
  minioData:
  milvusData:
